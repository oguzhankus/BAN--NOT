name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed application areas
        run: npx eslint src/app/admin/page.tsx src/app/api/admin/route.ts src/lib/api-utils.ts src/lib/db.ts src/lib/seed.ts make-admin.js scripts/seed-database.mjs scripts/live-smoke.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Build and smoke test
        run: npm run test:live
